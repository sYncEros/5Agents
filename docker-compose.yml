version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ai-team-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_team_db}
      MYSQL_USER: ${MYSQL_USER:-ai_team_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_pw}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
    name: ai-team-db-data
